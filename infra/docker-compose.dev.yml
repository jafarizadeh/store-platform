services:
  postgres:
    image: postgres:17-alpine
    container_name: bynet-postgres
    restart: unless-stopped

    env_file:
      - ../backend/.env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - bynet-postgres-data:/var/lib/postgresql/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bynet-postgres-data:

name: ByNET Quality Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: development
      APP_NAME: ByNET API
      DATABASE_URL: postgresql+psycopg://bynet:ci-only-password@127.0.0.1:5432/bynet
      ALLOWED_HOSTS: '["127.0.0.1","localhost","testserver"]'
      BACKEND_API_URL: http://127.0.0.1:8000

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: bynet
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bynet

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U bynet -d bynet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create backend virtual environment
        run: python -m venv backend/.venv

      - name: Install backend dependencies
        run: |
          backend/.venv/bin/pip install \
            --require-hashes \
            -r backend/requirements.txt

          backend/.venv/bin/pip install \
            --require-hashes \
            -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Run ByNET Quality Gate
        env:
          NO_COLOR: "1"
        run: ./scripts/check-all.sh

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"../tests/*" = ["S101"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]
